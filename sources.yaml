# clash-rules-srs — 远程规则源与最终 dat tag 映射
# format 默认 yaml；behavior 为 domain、ipcidr 或 classical。
# outputs 必须逐侧声明最终 tag；create 新建 tag，merge-base 与底包同名 tag 精确去重后合并。
sources:
  # Loyalsoldier/clash-rules（Clash YAML payload）
  - id: loyalsoldier-reject
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    outputs:
      geosite: {tag: reject, mode: create}
  - id: loyalsoldier-icloud
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    outputs:
      geosite: {tag: icloud, mode: merge-base}
  - id: loyalsoldier-apple
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    outputs:
      geosite: {tag: apple, mode: merge-base}
  - id: loyalsoldier-google
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt
    outputs:
      geosite: {tag: google, mode: merge-base}
  - id: loyalsoldier-proxy
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    outputs:
      geosite: {tag: proxy, mode: create}
  - id: loyalsoldier-direct
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    outputs:
      geosite: {tag: direct, mode: create}
  - id: loyalsoldier-private
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    outputs:
      geosite: {tag: private, mode: merge-base}
  - id: loyalsoldier-gfw
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt
    outputs:
      geosite: {tag: gfw, mode: create}
  - id: loyalsoldier-tld-not-cn
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt
    outputs:
      geosite: {tag: tld-not-cn, mode: create}
  - id: loyalsoldier-telegramcidr
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt
    outputs:
      geoip: {tag: telegram, mode: merge-base}
  - id: loyalsoldier-cncidr
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    outputs:
      geoip: {tag: cn, mode: merge-base}
  - id: loyalsoldier-lancidr
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt
    outputs:
      geoip: {tag: private, mode: merge-base}

  # applications 为进程规则，路由器 geodata 不转换。
  # xiaolin-007/clash（混合 domain 与 CIDR 的 classical 规则）
  - id: xiaolin-youtube
    behavior: classical
    url: https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/YouTube.txt
    outputs:
      geosite: {tag: youtube, mode: merge-base}
  - id: xiaolin-netflix
    behavior: classical
    url: https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/Netflix.txt
    outputs:
      geosite: {tag: netflix, mode: merge-base}
      geoip: {tag: netflix, mode: merge-base}
  - id: xiaolin-spotify
    behavior: classical
    url: https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/Spotify.txt
    outputs:
      geosite: {tag: spotify, mode: merge-base}
  - id: xiaolin-bilibili
    behavior: classical
    url: https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/BilibiliHMT.txt
    outputs:
      geosite: {tag: BilibiliHMT, mode: create}
      geoip: {tag: BilibiliHMT, mode: create}
  - id: xiaolin-tiktok
    behavior: classical
    url: https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/TikTok.txt
    outputs:
      geosite: {tag: tiktok, mode: merge-base}

  # Sukka（纯文本 classical，每行一条 Clash 规则）
  - id: sukka-ai
    behavior: classical
    format: text
    url: https://ruleset.skk.moe/Clash/non_ip/ai.txt
    outputs:
      geosite: {tag: ai, mode: create}
