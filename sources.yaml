# clash-rules-srs — 源清单
# 每个源按 sides 契约生成同名 geosite/geoip tag；构建会拒绝实际侧与声明不一致
# format 默认 yaml（Clash payload 列表）；text 为纯规则行（每行一条 Clash 规则）
# behavior: domain（域名集）/ ipcidr（CIDR 集）/ classical（混合规则，每行一条 TYPE,value 规则）
sources:
  # ===== Loyalsoldier/clash-rules（yaml payload）=====
  - {name: loyalsoldier-reject,       behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"}
  - {name: loyalsoldier-icloud,       behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"}
  - {name: loyalsoldier-apple,        behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"}
  - {name: loyalsoldier-google,       behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt"}
  - {name: loyalsoldier-proxy,        behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"}
  - {name: loyalsoldier-direct,       behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"}
  - {name: loyalsoldier-private,      behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"}
  - {name: loyalsoldier-gfw,          behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt"}
  - {name: loyalsoldier-tld-not-cn,   behavior: domain,    sides: [geosite], url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt"}
  - {name: loyalsoldier-telegramcidr, behavior: ipcidr,    sides: [geoip],   url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"}
  - {name: loyalsoldier-cncidr,       behavior: ipcidr,    sides: [geoip],   url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"}
  - {name: loyalsoldier-lancidr,      behavior: ipcidr,    sides: [geoip],   url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt"}
  # applications（classical / PROCESS-NAME）在路由器场景无意义，不转换
  # ===== xiaolin-007/clash（yaml classical，含 IP-CIDR 混合）=====
  - {name: xiaolin-youtube,   behavior: classical, sides: [geosite],        url: "https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/YouTube.txt"}
  - {name: xiaolin-netflix,   behavior: classical, sides: [geosite, geoip], url: "https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/Netflix.txt"}
  - {name: xiaolin-spotify,   behavior: classical, sides: [geosite],        url: "https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/Spotify.txt"}
  - {name: xiaolin-bilibili,  behavior: classical, sides: [geosite, geoip], url: "https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/BilibiliHMT.txt"}
  - {name: xiaolin-tiktok,    behavior: classical, sides: [geosite],        url: "https://raw.githubusercontent.com/xiaolin-007/clash/main/rule/TikTok.txt"}
  # ===== Sukka（text classical，每行一条规则）=====
  - {name: sukka-ai,          behavior: classical, format: text, sides: [geosite], url: "https://ruleset.skk.moe/Clash/non_ip/ai.txt"}
  # ===== 自定义接口：在此追加你自己的源，保持同样字段（name/behavior/url[/format]）=====
