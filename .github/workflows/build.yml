name: build-geodata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geodata-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go tests
        run: go test ./...

      - name: Bootstrap pinned tools
        run: go run ./cmd/geodata-build bootstrap --cache-root .cache

      - name: Run real-tool integration test
        run: go test -tags=integration ./internal/app

      - name: Build exact release payload
        run: |
          set -euo pipefail
          TAG="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          go run ./cmd/geodata-build build \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$TAG"

      - name: Verify all checksums
        run: |
          set -euo pipefail
          cd publish
          sha256sum -c geoip.dat.sha256sum
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c install_passwall2_rules.sh.sha256sum

      - name: Upload verified six-asset payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-geodata
          path: |
            publish/geoip.dat
            publish/geoip.dat.sha256sum
            publish/geosite.dat
            publish/geosite.dat.sha256sum
            publish/install_passwall2_rules.sh
            publish/install_passwall2_rules.sh.sha256sum
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-geodata
          path: publish

      - name: Verify exact payload and checksums
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            geoip.dat \
            geoip.dat.sha256sum \
            geosite.dat \
            geosite.dat.sha256sum \
            install_passwall2_rules.sh \
            install_passwall2_rules.sh.sha256sum)
          actual=$(find publish -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual" = "$expected"
          cd publish
          sha256sum -c geoip.dat.sha256sum
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c install_passwall2_rules.sh.sha256sum

      - name: Stage, read back, and publish exact Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "geodata ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Verified geodata build from ${GITHUB_SHA}"
          gh release upload "$TAG" \
            publish/geoip.dat \
            publish/geoip.dat.sha256sum \
            publish/geosite.dat \
            publish/geosite.dat.sha256sum \
            publish/install_passwall2_rules.sh \
            publish/install_passwall2_rules.sh.sha256sum
          expected=$(printf '%s\n' \
            geoip.dat \
            geoip.dat.sha256sum \
            geosite.dat \
            geosite.dat.sha256sum \
            install_passwall2_rules.sh \
            install_passwall2_rules.sh.sha256sum)
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
          target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')
          test "$target" = "$GITHUB_SHA"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          trap - ERR
