name: build-geodata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geodata-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Bootstrap build tools
        run: |
          bash scripts/bootstrap_vendor.sh
          echo "$PWD/vendor/bin" >> "$GITHUB_PATH"

      - name: Build and verify geodata
        run: |
          python scripts/build.py
          python scripts/probe_tags.py \
            --dat publish/geosite.dat \
            --expect build/expected_tags.json \
            --side geosite
          python scripts/probe_tags.py \
            --dat publish/geoip.dat \
            --expect build/expected_tags.json \
            --side geoip
          cd publish
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c geoip.dat.sha256sum

      - name: Publish rolling latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: geodata
          name: geodata release
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            publish/geosite.dat
            publish/geoip.dat
            publish/geosite.dat.sha256sum
            publish/geoip.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish
          path: publish/
