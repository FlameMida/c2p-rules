name: build-geodata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish a fully verified candidate without comparing latest
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: geodata-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release_decision.outputs.should_publish }}
      reason: ${{ steps.release_decision.outputs.reason }}
      baseline_release_id: ${{ steps.release_decision.outputs.baseline_release_id }}
      baseline_tag: ${{ steps.release_decision.outputs.baseline_tag }}
      baseline_fingerprint: ${{ steps.release_decision.outputs.baseline_fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go tests
        run: go test ./...

      - name: Bootstrap pinned tools
        run: go run ./cmd/geodata-build bootstrap --cache-root .cache

      - name: Run real-tool integration test
        run: go test -tags=integration ./internal/app

      - name: Build exact release payload
        run: |
          set -euo pipefail
          TAG="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          go run ./cmd/geodata-build build \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$TAG"

      - name: Verify all checksums
        run: |
          set -euo pipefail
          cd publish
          sha256sum -c geoip.dat.sha256sum
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c install_passwall2_rules.sh.sha256sum

      - name: Resolve release decision
        id: release_decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish || false }}
        run: |
          set -euo pipefail
          decision_file=$(mktemp)
          baseline_release_id=none
          baseline_tag=none

          if [ "$FORCE_PUBLISH" = "true" ]; then
            go run ./cmd/geodata-build release-decision \
              --candidate publish \
              --candidate-tag "$RELEASE_TAG" \
              --force > "$decision_file"
          else
            latest_response=$(mktemp)
            set +e
            latest_status=$(curl \
              --silent \
              --show-error \
              --location \
              --fail-with-body \
              --output "$latest_response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              if [ "$curl_status" -ne 22 ] || [ "$latest_status" != "404" ]; then
                echo "latest release query failed: curl=$curl_status http=$latest_status" >&2
                exit "$curl_status"
              fi
            fi

            case "$latest_status" in
              200)
                baseline_release_id=$(jq -er '.id' "$latest_response")
                baseline_tag=$(jq -er '.tag_name' "$latest_response")
                baseline_dir=$(mktemp -d)
                gh release download "$baseline_tag" \
                  --repo "$GITHUB_REPOSITORY" \
                  --dir "$baseline_dir"
                go run ./cmd/geodata-build release-decision \
                  --candidate publish \
                  --candidate-tag "$RELEASE_TAG" \
                  --baseline "$baseline_dir" \
                  --baseline-tag "$baseline_tag" > "$decision_file"
                ;;
              404)
                go run ./cmd/geodata-build release-decision \
                  --candidate publish \
                  --candidate-tag "$RELEASE_TAG" \
                  --first-release > "$decision_file"
                ;;
              *)
                echo "unexpected latest release status: $latest_status" >&2
                exit 1
                ;;
            esac
          fi

          cat "$decision_file"
          cat "$decision_file" >> "$GITHUB_OUTPUT"
          echo "baseline_release_id=$baseline_release_id" >> "$GITHUB_OUTPUT"
          echo "baseline_tag=$baseline_tag" >> "$GITHUB_OUTPUT"

      - name: Upload verified six-asset payload
        if: steps.release_decision.outputs.should_publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-geodata
          path: |
            publish/geoip.dat
            publish/geoip.dat.sha256sum
            publish/geosite.dat
            publish/geosite.dat.sha256sum
            publish/install_passwall2_rules.sh
            publish/install_passwall2_rules.sh.sha256sum
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.should_publish == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download verified payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-geodata
          path: publish

      - name: Verify exact payload and checksums
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            geoip.dat \
            geoip.dat.sha256sum \
            geosite.dat \
            geosite.dat.sha256sum \
            install_passwall2_rules.sh \
            install_passwall2_rules.sh.sha256sum)
          actual=$(find publish -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual" = "$expected"
          cd publish
          sha256sum -c geoip.dat.sha256sum
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c install_passwall2_rules.sh.sha256sum

      - name: Recheck release baseline before write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECISION_REASON: ${{ needs.build.outputs.reason }}
          BASELINE_RELEASE_ID: ${{ needs.build.outputs.baseline_release_id }}
          BASELINE_TAG: ${{ needs.build.outputs.baseline_tag }}
          BASELINE_FINGERPRINT: ${{ needs.build.outputs.baseline_fingerprint }}
        run: |
          set -euo pipefail
          candidate_tag="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          query_latest() {
            latest_response=$(mktemp)
            set +e
            latest_status=$(curl \
              --silent \
              --show-error \
              --location \
              --fail-with-body \
              --output "$latest_response" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")
            curl_status=$?
            set -e
            if [ "$curl_status" -ne 0 ]; then
              if [ "$curl_status" -ne 22 ] || [ "$latest_status" != "404" ]; then
                echo "latest release recheck failed: curl=$curl_status http=$latest_status" >&2
                exit "$curl_status"
              fi
            fi
            case "$latest_status" in
              200|404) ;;
              *)
                echo "unexpected latest release status during recheck: $latest_status" >&2
                exit 1
                ;;
            esac
          }

          case "$DECISION_REASON" in
            forced)
              forced_decision=$(mktemp)
              go run ./cmd/geodata-build release-decision \
                --candidate publish \
                --candidate-tag "$candidate_tag" \
                --force > "$forced_decision"
              grep -qx 'should_publish=true' "$forced_decision"
              grep -qx 'reason=forced' "$forced_decision"
              ;;
            first-release)
              query_latest
              if [ "$latest_status" != "404" ]; then
                echo "latest appeared after first-release decision" >&2
                exit 1
              fi
              first_decision=$(mktemp)
              go run ./cmd/geodata-build release-decision \
                --candidate publish \
                --candidate-tag "$candidate_tag" \
                --first-release > "$first_decision"
              grep -qx 'should_publish=true' "$first_decision"
              grep -qx 'reason=first-release' "$first_decision"
              ;;
            changed)
              query_latest
              if [ "$latest_status" != "200" ]; then
                echo "latest disappeared after changed decision" >&2
                exit 1
              fi
              current_release_id=$(jq -er '.id' "$latest_response")
              current_tag=$(jq -er '.tag_name' "$latest_response")
              if [ "$current_release_id" != "$BASELINE_RELEASE_ID" ]; then
                echo "baseline release ID changed" >&2
                exit 1
              fi
              if [ "$current_tag" != "$BASELINE_TAG" ]; then
                echo "baseline tag changed" >&2
                exit 1
              fi
              baseline_dir=$(mktemp -d)
              gh release download "$current_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$baseline_dir"
              recheck_decision=$(mktemp)
              go run ./cmd/geodata-build release-decision \
                --candidate publish \
                --candidate-tag "$candidate_tag" \
                --baseline "$baseline_dir" \
                --baseline-tag "$current_tag" > "$recheck_decision"
              grep -qx 'should_publish=true' "$recheck_decision"
              grep -qx 'reason=changed' "$recheck_decision"
              baseline_fingerprint=$(sed -n 's/^baseline_fingerprint=//p' "$recheck_decision")
              if [ "$baseline_fingerprint" != "$BASELINE_FINGERPRINT" ]; then
                echo "baseline fingerprint changed" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported release decision reason: $DECISION_REASON" >&2
              exit 1
              ;;
          esac

      - name: Stage, read back, and publish exact Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "geodata ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Verified geodata build from ${GITHUB_SHA}"
          gh release upload "$TAG" \
            publish/geoip.dat \
            publish/geoip.dat.sha256sum \
            publish/geosite.dat \
            publish/geosite.dat.sha256sum \
            publish/install_passwall2_rules.sh \
            publish/install_passwall2_rules.sh.sha256sum
          expected=$(printf '%s\n' \
            geoip.dat \
            geoip.dat.sha256sum \
            geosite.dat \
            geosite.dat.sha256sum \
            install_passwall2_rules.sh \
            install_passwall2_rules.sh.sha256sum)
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
          target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')
          test "$target" = "$GITHUB_SHA"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          readback=$(mktemp -d)
          gh release download "$TAG" --dir "$readback"
          actual_readback=$(find "$readback" -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual_readback" = "$expected"
          (
            cd "$readback"
            sha256sum -c geoip.dat.sha256sum
            sha256sum -c geosite.dat.sha256sum
            sha256sum -c install_passwall2_rules.sh.sha256sum
          )
          go run ./cmd/geodata-build release-decision \
            --candidate "$readback" \
            --candidate-tag "$TAG" \
            --force
          gh release edit "$TAG" --draft=false --latest
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          trap - ERR
