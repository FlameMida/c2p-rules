name: build-geodata

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geodata-release
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install converter dependencies
        working-directory: tools/clash2passwall
        run: npm ci --ignore-scripts

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run converter tests in builtin and js-yaml modes
        working-directory: tools/clash2passwall
        run: npm test

      - name: Bootstrap pinned build tools
        run: |
          bash scripts/bootstrap_vendor.sh
          echo "$PWD/vendor/bin" >> "$GITHUB_PATH"

      - name: Build and verify geodata
        run: |
          python scripts/build.py
          node tools/clash2passwall/clash2passwall.js \
            tools/clash2passwall/tests/fixtures/mini_clash.yaml \
            --dat \
            --tag-manifest build/expected_tags.json \
            --out build/clash2passwall-smoke \
            --no-install
          node tools/clash2passwall/scripts/verify_manifest_refs.cjs \
            build/clash2passwall-smoke/passwall2_shunt_rules_dat.conf \
            build/expected_tags.json
          python scripts/probe_tags.py \
            --dat publish/geosite.dat \
            --expect build/expected_tags.json \
            --side geosite
          python scripts/probe_tags.py \
            --dat publish/geosite.dat \
            --expect build/expected_tags.json \
            --side geosite \
            --forbid
          python scripts/probe_tags.py \
            --dat publish/geoip.dat \
            --expect build/expected_tags.json \
            --side geoip
          python scripts/probe_tags.py \
            --dat publish/geoip.dat \
            --expect build/expected_tags.json \
            --side geoip \
            --forbid
          cd publish
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c geoip.dat.sha256sum

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-geodata
          path: publish/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-geodata
          path: publish

      - name: Verify exact payload and checksums
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' geoip.dat geoip.dat.sha256sum geosite.dat geosite.dat.sha256sum)
          actual=$(find publish -maxdepth 1 -type f -exec basename {} \; | sort)
          test "$actual" = "$expected"
          cd publish
          sha256sum -c geosite.dat.sha256sum
          sha256sum -c geoip.dat.sha256sum

      - name: Stage, read back, and publish exact Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="geodata-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          trap cleanup ERR
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "geodata ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Verified geodata build from ${GITHUB_SHA}"
          gh release upload "$TAG" \
            publish/geosite.dat \
            publish/geoip.dat \
            publish/geosite.dat.sha256sum \
            publish/geoip.dat.sha256sum
          expected=$(printf '%s\n' geoip.dat geoip.dat.sha256sum geosite.dat geosite.dat.sha256sum)
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
          TARGET_COMMITISH=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.target_commitish')
          test "$TARGET_COMMITISH" = "$GITHUB_SHA"
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$TAG_SHA" = "$GITHUB_SHA"
          gh release edit "$TAG" --draft=false --latest
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$TAG_SHA" = "$GITHUB_SHA"
          trap - ERR
